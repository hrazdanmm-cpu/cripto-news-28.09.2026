name: Post crypto news to Telegram

on:
  schedule:
    # Every 20 minutes, but NOT at :00/:20/:40 (GitHub is most overloaded then and often skips those runs)
    - cron: '7,27,47 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: post-news
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: npm run post

      - name: Commit updated posted.json
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update posted.json [skip ci]"
          file_pattern: data/posted.json
